# Architecture
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # Exclude timestep 0 when warping the schedule.
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3

# Inference
data_path: /path/to/interactive_prompts.jsonl
output_folder: outputs/longlive/interactive
inference_iter: -1
num_output_frames: 240
use_ema: false
seed: 1
num_samples: 1
save_with_index: true
switch_frame_indices: 40, 80, 120, 160, 200
global_sink: true
context_noise: 0

generator_ckpt: longlive_models/models/longlive_base.pt
lora_ckpt: longlive_models/models/lora.pt

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  verbose: false

# DASA
dasa:
  token_selection:
    similarity_threshold: 0.8
    search_size: 3
    dilation_size: 3
  kv_compression:
    shallow_threshold: 0.8
    deep_threshold: 0.2
    max_token_age: 6
  motion_loss:
    scale: 2.0
